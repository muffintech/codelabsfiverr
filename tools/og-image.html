<!doctype html>
<!-- Source for assets/og-image.png (1200x630). Re-render with tools/render.mjs after edits. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&amp;family=Bagel+Fat+One&amp;family=Figtree:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; background: #F4EEE3; color: #1D1B16; font-family: "Figtree", sans-serif; position: relative; overflow: hidden; }
  .logo { position: absolute; left: 64px; top: 52px; font: 34px "Young Serif"; letter-spacing: -.03em; }
  .logo span { color: #008060; }
  h1 { position: absolute; left: 64px; top: 140px; width: 640px; margin: 0; font: 400 78px/1.02 "Young Serif"; letter-spacing: -.03em; }
  .mark { color: #008060; position: relative; display: inline-block; isolation: isolate; }
  .mark::after { content: ""; position: absolute; left: -4%; right: -4%; bottom: .04em; height: .2em; background: #FFB627; border-radius: 99px; z-index: -1; transform: rotate(-2deg); }
  .proof { position: absolute; left: 64px; bottom: 58px; font-size: 22px; color: #6B6558; display: flex; gap: 30px; }
  .proof b { font: 400 30px "Young Serif"; color: #1D1B16; margin-right: 6px; }
  .sun { position: absolute; right: 70px; top: 90px; width: 440px; height: 440px; border-radius: 50%; background: #FFB627; }
  img { position: absolute; right: -10px; bottom: 0; width: 560px; -webkit-mask-image: linear-gradient(#000 80%, transparent); }
  .sticker { position: absolute; font: 24px/1.1 "Bagel Fat One"; padding: 14px 18px; border-radius: 14px; border: 2px solid #1D1B16; box-shadow: 4px 4px 0 #1D1B16; text-align: center; }
  .s1 { right: 400px; top: 400px; background: #008060; color: #fff; transform: rotate(-6deg); }
  .s2 { right: 50px; top: 60px; background: #F25C3B; color: #fff; transform: rotate(6deg); }
</style>
</head>
<body>
  <div class="logo">codelabs<span>.</span></div>
  <h1>I build Shopify stores people <span class="mark">love</span> to shop.</h1>
  <div class="proof"><span><b>5.0 ★</b>270+ reviews</span><span><b>400+</b>Shopify stores</span></div>
  <div class="sun"></div>
  <img src="../assets/img/nitin-cutout.webp" alt="">
  <div class="sticker s1">Fiverr Pro</div>
  <div class="sticker s2">Shopify Partner</div>
</body>
</html>
