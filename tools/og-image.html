<!doctype html>
<!-- Source for assets/og-image.png (1200x630). Re-render with tools/render.mjs after edits. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=Mulish:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; background: #F5F2EB; font-family: "IBM Plex Sans", sans-serif; color: #0C0E14; position: relative; overflow: hidden; }
  .name { position: absolute; left: 56px; bottom: 120px; font: 900 300px/0.8 "Archivo"; font-variation-settings: "wdth" 125; letter-spacing: -.045em; text-transform: uppercase; }
  .glow { position: absolute; right: -120px; bottom: -200px; width: 700px; height: 700px; background: radial-gradient(closest-side, rgba(47,76,255,.22), transparent 70%); }
  .top { position: absolute; left: 56px; top: 48px; right: 56px; display: flex; align-items: center; gap: 12px; }
  .word { font: 800 34px "Archivo"; letter-spacing: -.03em; }
  .chip { margin-left: auto; font: 800 18px "Mulish"; background: #0C0E14; color: #fff; padding: 10px 18px; border-radius: 999px; }
  .line { position: absolute; left: 56px; right: 56px; bottom: 44px; display: flex; justify-content: space-between; align-items: flex-end; }
  .tag { font: 700 34px/1.15 "Archivo"; letter-spacing: -.02em; max-width: 640px; }
  .tag em { font-style: normal; background: linear-gradient(transparent 62%, #FFD23F 62%, #FFD23F 92%, transparent 92%); }
  .card { position: absolute; right: 64px; top: 140px; background: #0C0E14; color: #fff; border-radius: 22px; padding: 22px 26px; width: 250px; }
  .card .k { font: 800 15px "Mulish"; color: #A3A8B6; }
  .card .v { font: 900 64px/1 "Archivo"; font-variation-settings: "wdth" 115; color: #FFD23F; margin: 6px 0; }
  .card .s { font-size: 16px; color: #A3A8B6; }
  .badge { position: absolute; right: 340px; top: 210px; background: #FFD23F; border-radius: 20px; padding: 16px 22px; text-align: center; }
  .badge .v { font: 900 46px/1 "Archivo"; }
  .badge .s { font: 700 15px "Mulish"; }
  .stats { font: 800 20px "Mulish"; color: #2F4CFF; text-align: right; line-height: 1.5; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="top">
    <svg viewBox="0 0 32 32" width="44" height="44"><rect width="32" height="32" rx="9" fill="#0C0E14"/><path d="M19.5 10.5a7 7 0 1 0 0 11" fill="none" stroke="#FFD23F" stroke-width="3.4" stroke-linecap="round"/><circle cx="22.5" cy="16" r="2.2" fill="#2F4CFF"/></svg>
    <span class="word">codelabs</span>
    <span class="chip">Certified Shopify Partner</span>
  </div>
  <div class="name">Nitin</div>
  <div class="badge"><div class="v">5.0★</div><div class="s">270+ reviews</div></div>
  <div class="card"><div class="k">ShoeRack · UK</div><div class="v">+240%</div><div class="s">sales in the first week after launch</div></div>
  <div class="line">
    <p class="tag" style="margin:0">Shopify stores that sell, and <em>you work with me directly.</em></p>
    <p class="stats" style="margin:0">400+ stores launched<br>Prices in $ · £ · A$</p>
  </div>
</body>
</html>
