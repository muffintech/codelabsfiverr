<!doctype html>
<!-- Source for assets/og-image.png (1200x630). Re-render with tools/render.mjs after edits. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100,500..800&amp;family=Instrument+Serif:ital@1&amp;family=Mulish:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; background: #FBF8F1; color: #0E2A21; font-family: "Mulish", sans-serif; position: relative; overflow: hidden; }
  .top { position: absolute; left: 64px; top: 56px; display: flex; align-items: center; gap: 12px; font: 800 32px "Archivo"; letter-spacing: -.04em; }
  h1 { position: absolute; left: 64px; top: 150px; width: 600px; margin: 0; font: 700 76px/0.98 "Archivo"; letter-spacing: -.045em; }
  h1 em { font-family: "Instrument Serif"; font-weight: 400; font-style: italic; color: #008060; font-size: 1.08em; }
  .badges { position: absolute; left: 64px; bottom: 60px; display: flex; gap: 10px; }
  .badges span { font: 800 19px "Mulish"; padding: 10px 16px; border-radius: 999px; background: #fff; border: 1px solid rgba(14,42,33,.14); }
  .badges span:first-child { background: #0E2A21; color: #C8F169; border-color: #0E2A21; }
  .panel { position: absolute; right: 56px; top: 48px; width: 450px; height: 534px; border-radius: 36px; overflow: hidden; background: radial-gradient(120% 90% at 50% 0%, #0E9B75 0%, #008060 38%, #004C3F 100%); }
  .ring { position: absolute; left: 50%; top: 36%; width: 300px; height: 300px; border-radius: 50%; background: #C8F169; transform: translate(-50%, -50%); }
  .panel img { position: absolute; left: -2%; bottom: 0; width: 118%; }
  .stat { position: absolute; right: 420px; top: 330px; background: #0E2A21; color: #fff; border-radius: 20px; padding: 18px 22px; box-shadow: 0 20px 40px -20px rgba(0,0,0,.5); }
  .stat b { display: block; font: 800 46px/1 "Archivo"; letter-spacing: -.04em; color: #C8F169; }
  .stat span { font-size: 16px; color: #A9BDB3; }
</style>
</head>
<body>
  <div class="top"><svg viewBox="0 0 36 36" width="46" height="46"><rect width="36" height="36" rx="10" fill="#0E2A21"/><path d="M21.5 11.5a7.6 7.6 0 1 0 0 13" fill="none" stroke="#C8F169" stroke-width="3.6" stroke-linecap="round"/><rect x="23" y="11" width="3.4" height="14" rx="1.7" fill="#00A47C"/></svg>codelabs</div>
  <h1>Shopify stores, designed and built <em>by me.</em></h1>
  <div class="badges"><span>Fiverr Pro</span><span>★ 5.0 · 270+ reviews</span><span>400+ stores</span></div>
  <div class="panel"><div class="ring"></div><img src="../assets/img/nitin-cutout.webp" alt=""></div>
  <div class="stat"><b>+240%</b><span>ShoeRack, launch week</span></div>
</body>
</html>
